name: CI - Node (Sekai backend)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Install & check all Node deps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure npm
        run: |
          set -e

          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false

          echo "=== Node ==="
          node --version

          echo "=== npm ==="
          npm --version

          echo "=== npm registry ==="
          npm config get registry

      - name: Validate package files
        run: |
          set -e

          echo "=== Validando package.json ==="
          test -f package.json

          echo "=== Validando package-lock.json ==="
          test -f package-lock.json

          node <<'NODE'
          const fs = require('fs');

          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          if (!p.dependencies) {
            throw new Error('No existe dependencies en package.json');
          }

          const required = [
            'express',
            'dotenv',
            'cors',
            'qrcode',
            '@whiskeysockets/baileys',
            '@supabase/supabase-js'
          ];

          for (const dep of required) {
            if (!p.dependencies[dep]) {
              throw new Error(`Falta dependencia: ${dep}`);
            }
          }

          console.log('OK: Dependencias declaradas correctamente.');
          NODE

      - name: Check lockfile registry
        run: |
          set -e

          echo "=== Comprobando package-lock.json ==="

          if grep -nE '35\.245\.43\.102|registry\.npmjs\.org/npm' package-lock.json; then
            echo "::error::package-lock.json contiene referencias a un registro externo."
            echo "::error::Regenera package-lock.json usando registry.npmjs.org."
            exit 1
          fi

          echo "OK: Lockfile sin referencias al registro antiguo."

      - name: Validate lockfile
        run: |
          set -e

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --registry=https://registry.npmjs.org/

          git diff --exit-code -- package-lock.json

          echo "OK: package-lock.json coincide con package.json."

      - name: Install dependencies
        run: |
          set -e

          rm -rf node_modules

          npm ci \
            --include=prod \
            --registry=https://registry.npmjs.org/

      - name: Show installed dependency tree
        run: |
          set -e

          echo "=== Node ==="
          node --version

          echo "=== npm ==="
          npm --version

          echo "=== npm root ==="
          npm root

          echo "=== Dependencias principales ==="

          npm ls \
            express \
            dotenv \
            cors \
            qrcode \
            @whiskeysockets/baileys \
            @supabase/supabase-js \
            --depth=0

      - name: Verify package tree
        run: |
          set -e

          echo "=== Verificando resolución de módulos ==="

          node <<'NODE'
          const modules = [
            'express',
            'dotenv',
            'cors',
            'qrcode',
            '@whiskeysockets/baileys',
            '@supabase/supabase-js'
          ];

          let failed = false;

          for (const mod of modules) {
            try {
              const resolved = require.resolve(mod);
              console.log(`OK: ${mod} -> ${resolved}`);
            } catch (error) {
              failed = true;
              console.error(`FALTA: ${mod}`);
              console.error(error.message);
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log('OK: todos los módulos requeridos se pueden resolver.');
          NODE

      - name: Syntax check server.js
        run: |
          set -e

          test -f server.js

          npm run check

      - name: Validate public files
        run: |
          set -e

          echo "=== Verificando archivos públicos ==="

          test -f public/index.html
          test -f public/app.js

          echo "OK: public/index.html"
          echo "OK: public/app.js"

      - name: Smoke load
        env:
          PORT: 3000
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          HOSHI_URL: https://example.com
          BROWSER_ENGINE: hoshi
        run: |
          set -e

          node <<'NODE'
          require('dotenv').config();

          const fs = require('fs');

          const requiredFiles = [
            'server.js',
            'public/index.html',
            'public/app.js'
          ];

          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) {
              throw new Error(`${file} missing`);
            }

            console.log(`FILE OK: ${file}`);
          }

          const modules = [
            'express',
            'cors',
            'dotenv',
            'qrcode',
            '@supabase/supabase-js',
            '@whiskeysockets/baileys'
          ];

          for (const mod of modules) {
            require(mod);
            console.log(`MODULE OK: ${mod}`);
          }

          console.log('Smoke OK');
          NODE

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekai-source
          path: |
            server.js
            package.json
            package-lock.json
            public/
            supabase_schema.sql
            SUPABASE_SETUP.md
            README.md
            .env.example
          if-no-files-found: warn
          retention-days: 7

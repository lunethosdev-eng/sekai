name: CI – Node (Sekai backend)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node:
    name: Install & check all Node deps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || (rm -rf node_modules && npm install)

      - name: Verify package tree
        run: |
          echo "=== Verificando resolución de módulos ==="
          node -e "
            require.resolve('express');
            require.resolve('dotenv');
            require.resolve('cors');
            require.resolve('qrcode');
            require.resolve('@whiskeysockets/baileys');
            require.resolve('@supabase/supabase-js');
          "
          echo "OK: express, dotenv, cors, qrcode, baileys, supabase-js"

      - name: Syntax check server.js
        run: npm run check

      - name: Smoke load (sin arrancar puerto)
        env:
          PORT: 3000
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          HOSHI_URL: https://example.com
          BROWSER_ENGINE: hoshi
        run: |
          node -e "
            require('dotenv').config();
            const fs = require('fs');
            if (!fs.existsSync('server.js')) throw new Error('server.js missing');
            if (!fs.existsSync('public/index.html')) throw new Error('public/index.html missing');
            if (!fs.existsSync('public/app.js')) throw new Error('public/app.js missing');
            require('express');
            require('cors');
            require('dotenv');
            require('qrcode');
            require('@supabase/supabase-js');
            console.log('Smoke OK');
          "

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekai-source
          path: |
            server.js
            package.json
            package-lock.json
            public
            supabase_schema.sql
            SUPABASE_SETUP.md
            README.md
            .env.example
          if-no-files-found: warn

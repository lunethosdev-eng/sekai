name: Android APK (Sekai)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject runtime config for WebView
        env:
          CHROMI_SUPABASE_URL: ${{ vars.CHROMI_SUPABASE_URL }}
          CHROMI_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CHROMI_SUPABASE_PUBLISHABLE_KEY }}
          CHROMI_API_BASE_URL: ${{ vars.CHROMI_API_BASE_URL }}
        run: |
          if [ -n "$CHROMI_SUPABASE_URL" ] && [ -n "$CHROMI_SUPABASE_PUBLISHABLE_KEY" ]; then
            cat > public/runtime-config.js << RCFG
          // Generated by GitHub Actions — publishable values only
          window.CHROMI_SUPABASE_URL = window.CHROMI_SUPABASE_URL || '${CHROMI_SUPABASE_URL}';
          window.CHROMI_SUPABASE_PUBLISHABLE_KEY = window.CHROMI_SUPABASE_PUBLISHABLE_KEY || '${CHROMI_SUPABASE_PUBLISHABLE_KEY}';
          window.CHROMI_API_BASE = window.CHROMI_API_BASE || '${CHROMI_API_BASE_URL}';
          RCFG
            echo "runtime-config.js actualizado con variables del repo"
          else
            echo "Sin vars Supabase: se usa runtime-config.js del repo"
          fi

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            echo "Generando wrapper..."
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sekai-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Release signing (si hay secrets de keystore)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > chromi-release.jks
          cat > keystore.properties << KP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          KP
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sekai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn


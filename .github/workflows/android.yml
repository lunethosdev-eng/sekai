name: Build Sekai APKs

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug o release'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [global, team, owner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Verify Android project
        working-directory: android
        run: |
          echo "=== Android project ==="
          pwd
          ls -la
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          echo "Android project OK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          FLAVOR="${{ matrix.flavor }}"
          
          # Capitaliza la primera letra (ej. global -> Global, release -> Release)
          FLAVOR_CAP="$(echo ${FLAVOR:0:1} | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          TYPE_CAP="$(echo ${TYPE:0:1} | tr '[:lower:]' '[:upper:]')${TYPE:1}"
          
          echo "Ejecutando: ./gradlew assemble${FLAVOR_CAP}${TYPE_CAP}"
          ./gradlew "assemble${FLAVOR_CAP}${TYPE_CAP}" --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: android
        run: |
          FLAVOR="${{ matrix.flavor }}"
          echo "=== Verificando APKs para $FLAVOR ==="
          find app/build/outputs -type f -name "*.apk" -print
          
          APK="$(find app/build/outputs/apk/$FLAVOR -type f -name "*.apk" -print -quit 2>/dev/null || find app/build/outputs -type f -name "*.apk" -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró ningún APK generado para $FLAVOR."
            exit 1
          fi
          echo "APK encontrado: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekai-${{ matrix.flavor }}-${{ github.event.inputs.build_type || 'release' }}
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true

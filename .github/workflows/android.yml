name: Android APK (Sekai)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        working-directory: android
        run: |
          echo "=== Android project ==="
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app
          echo "Android project OK"

      - name: Inject runtime config for WebView
        env:
          CHROMI_SUPABASE_URL: ${{ vars.CHROMI_SUPABASE_URL }}
          CHROMI_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CHROMI_SUPABASE_PUBLISHABLE_KEY }}
          CHROMI_API_BASE_URL: ${{ vars.CHROMI_API_BASE_URL }}
        run: |
          mkdir -p public

          if [ -n "$CHROMI_SUPABASE_URL" ] && [ -n "$CHROMI_SUPABASE_PUBLISHABLE_KEY" ]; then
            cat > public/runtime-config.js <<'RCFG'
          // Generated by GitHub Actions
          // Only publishable/public configuration belongs here.
          window.CHROMI_SUPABASE_URL = window.CHROMI_SUPABASE_URL || '${CHROMI_SUPABASE_URL}';
          window.CHROMI_SUPABASE_PUBLISHABLE_KEY = window.CHROMI_SUPABASE_PUBLISHABLE_KEY || '${CHROMI_SUPABASE_PUBLISHABLE_KEY}';
          window.CHROMI_API_BASE = window.CHROMI_API_BASE || '${CHROMI_API_BASE_URL}';
          RCFG

            echo "runtime-config.js actualizado"
          else
            echo "No hay variables Supabase configuradas."
            echo "Se utilizará runtime-config.js del repositorio si existe."
          fi

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "::error::No existe android/gradlew"
            echo "El wrapper debería estar incluido en el repositorio."
            exit 1
          fi

      - name: Validate Gradle wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Assemble Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify Debug APK
        run: |
          echo "=== APK generado ==="
          find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No se generó ningún APK Debug"
            exit 1
          fi

          echo "APK Debug encontrado."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sekai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > chromi-release.jks

          cat > keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=chromi-release.jks
          EOF

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "=== Release APK ==="
          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No se generó ningún APK Release"
            exit 1
          fi

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sekai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

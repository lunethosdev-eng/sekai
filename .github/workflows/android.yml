name: Android APK (Sekai)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Verify Android project
        working-directory: android
        run: |
          echo "=== Android project ==="
          pwd
          ls -la
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          echo "Android project OK"

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK was generated
        working-directory: android
        run: |
          echo "=== APK output ==="
          find app/build/outputs -type f -name "*.apk" -print
          APK="$(find app/build/outputs -type f -name "*.apk" -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi
          echo "APK encontrado: $APK"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sekai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

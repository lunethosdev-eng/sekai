name: Build Sekai APKs

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug o release'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [global, team, owner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} APK
        working-directory: android
        run: |
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          FLAVOR="${{ matrix.flavor }}"
          FLAVOR_CAP="$(echo ${FLAVOR:0:1} | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          TYPE_CAP="$(echo ${TYPE:0:1} | tr '[:lower:]' '[:upper:]')${TYPE:1}"
          ./gradlew "assemble${FLAVOR_CAP}${TYPE_CAP}" --no-daemon --stacktrace

      - name: Sign Release APK
        working-directory: android
        run: |
          FLAVOR="${{ matrix.flavor }}"
          APK="$(find app/build/outputs -type f -name "*.apk" | head -n 1)"
          if [ -n "$APK" ]; then
            echo "Firmando APK: $APK"
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android "$APK" || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekai-${{ matrix.flavor }}-${{ github.event.inputs.build_type || 'release' }}.apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true

# Genera 3 APKs: global (usuarios), team (devs), owner (tú)
name: Build Sekai APKs

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug o release'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [global, team, owner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} APK
        working-directory: android
        run: |
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          FLAVOR="${{ matrix.flavor }}"
          # Capitalize first letter for Gradle task: GlobalRelease, TeamDebug...
          FLAVOR_CAP="$(echo ${FLAVOR:0:1} | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          TYPE_CAP="$(echo ${TYPE:0:1} | tr '[:lower:]' '[:upper:]')${TYPE:1}"
          ./gradlew "assemble${FLAVOR_CAP}${TYPE_CAP}" --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekai-${{ matrix.flavor }}-${{ github.event.inputs.build_type || 'release' }}
          path: |
            android/app/build/outputs/apk/${{ matrix.flavor }}/**/*.apk
          if-no-files-found: warn

  # Job opcional: crear un Release en GitHub con los 3 APKs cuando hay tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true

plugins { id 'com.android.application' }

import java.util.Properties

def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('chromi-release.jks')
if (keystoreFile.exists()) {
    keystoreProperties.load(new FileInputStream(rootProject.file('keystore.properties')))
}

android {
    namespace 'com.sfxi.chromi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sfxi.chromi'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField "String", "APP_FLAVOR", "\"global\""
        buildConfigField "boolean", "IS_DEV", "false"
        buildConfigField "boolean", "IS_OWNER", "false"
        buildConfigField "boolean", "SHOW_DEV_MENU", "false"
    }

    buildFeatures { buildConfig true }

    flavorDimensions "audience"
    productFlavors {
        // 1) APK para todos los usuarios (Play Store / público)
        global {
            dimension "audience"
            applicationIdSuffix ""
            versionNameSuffix ""
            resValue "string", "app_name", "Sekai"
            buildConfigField "String", "APP_FLAVOR", "\"global\""
            buildConfigField "boolean", "IS_DEV", "false"
            buildConfigField "boolean", "IS_OWNER", "false"
            buildConfigField "boolean", "SHOW_DEV_MENU", "false"
        }
        // 2) APK para el equipo de desarrollo
        team {
            dimension "audience"
            applicationIdSuffix ".team"
            versionNameSuffix "-team"
            resValue "string", "app_name", "Sekai Team"
            buildConfigField "String", "APP_FLAVOR", "\"team\""
            buildConfigField "boolean", "IS_DEV", "true"
            buildConfigField "boolean", "IS_OWNER", "false"
            buildConfigField "boolean", "SHOW_DEV_MENU", "true"
        }
        // 3) APK del owner (tú) — superior al de team
        owner {
            dimension "audience"
            applicationIdSuffix ".owner"
            versionNameSuffix "-owner"
            resValue "string", "app_name", "Sekai Owner"
            buildConfigField "String", "APP_FLAVOR", "\"owner\""
            buildConfigField "boolean", "IS_DEV", "true"
            buildConfigField "boolean", "IS_OWNER", "true"
            buildConfigField "boolean", "SHOW_DEV_MENU", "true"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

tasks.register('syncWebAssets', Copy) {
    from rootProject.projectDir.parentFile.toPath().resolve('public').toFile()
    into file('src/main/assets/www')
}

preBuild.dependsOn syncWebAssets
